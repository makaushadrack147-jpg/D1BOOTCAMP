<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise XP Ninja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            background-color: #f9f9f9;
        }
        article {
            margin-bottom: 40px;
            border: 2px solid #333;
            padding: 20px;
            border-radius: 5px;
            background-color: white;
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        form {
            margin: 15px 0;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        label {
            display: block;
            margin: 10px 0 5px 0;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
        }
        input[type="button"],
        input[type="submit"],
        button {
            padding: 10px 15px;
            margin: 5px 5px 5px 0;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        input[type="button"]:hover,
        input[type="submit"]:hover,
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background-color: #e8f4f8;
            border-left: 4px solid #007bff;
            border-radius: 3px;
            display: none;
        }
        .result.show {
            display: block;
        }
        #totalTip {
            display: none;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
        .geolocation-result {
            margin-top: 15px;
            padding: 15px;
            background-color: #d4edda;
            border-left: 4px solid #28a745;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Exercise 1: Calculate the tip -->
    <article>
        <h2>Exercise 1: Calculate the Tip</h2>
        <form>
            <label for="billAmt">Bill Amount ($):</label>
            <input type="number" id="billAmt" placeholder="Enter bill amount" step="0.01" min="0">

            <label for="serviceQual">Service Quality (0-2):</label>
            <select id="serviceQual">
                <option value="0">Select service quality</option>
                <option value="0.15">15% - Poor</option>
                <option value="0.18">18% - Acceptable</option>
                <option value="0.20">20% - Good</option>
                <option value="0.25">25% - Excellent</option>
            </select>

            <label for="numOfPeople">Number of People:</label>
            <input type="number" id="numOfPeople" placeholder="Enter number of people" min="1">

            <input type="button" id="calculate" value="Calculate Tip" onclick="calculateTip()">
        </form>

        <div id="totalTip" class="result">
            <p>Tip per person: $<span id="tip">0.00</span></p>
            <p id="each">Each person should pay this amount</p>
        </div>
    </article>

    <!-- Exercise 2: Validate the email -->
    <article>
        <h2>Exercise 2: Validate the Email</h2>
        <form id="emailForm">
            <label for="emailInput">Enter your email:</label>
            <input type="email" id="emailInput" placeholder="example@email.com" required>
            <input type="submit" value="Validate Email">
        </form>
        <div id="emailResult"></div>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">
            <em>Validation includes: valid characters, @ sign, domain, and extension (e.g., .com, .org)</em>
        </p>
    </article>

    <!-- Exercise 3: Get the user's geolocation coordinates -->
    <article>
        <h2>Exercise 3: Get User's Geolocation</h2>
        <button id="geoButton" onclick="getGeolocation()">Get My Location</button>
        <div id="geoResult"></div>
    </article>

    <script src="exercise xp ninja.js"></script>
</body>
</html>
