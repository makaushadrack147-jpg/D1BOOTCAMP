<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily To Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="todo-app">
        <p class="eyebrow">Daily challenge</p>
        <h1>To do list</h1>
        <p class="intro">Keep today's tasks clear and visible.</p>

        <section class="todo-card" aria-labelledby="list-title">
            <div class="card-heading">
                <h2 id="list-title">My tasks</h2>
                <span id="task-count">0 tasks</span>
            </div>
            <form id="task-form">
                <label class="sr-only" for="task-input">New task</label>
                <input id="task-input" type="text" placeholder="Add a new task" autocomplete="off">
                <button type="submit">Submit</button>
            </form>
            <div class="listTasks" id="listTasks"></div>
        </section>
    </main>
</body>
</html>
