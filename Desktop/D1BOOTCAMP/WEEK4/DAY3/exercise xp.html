<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Forms and JSON Mario</title>
</head>
<body>
  <h1>HTML Forms</h1>

  <h2>Exercise 1:
  <form action="exercise xp.html" method="get">
    <label for="get-name">Name</label>
    <input id="get-name" name="name" type="text" required>

    <label for="get-message">Message</label>
    <textarea id="get-message" name="message" rows="5" required></textarea>

    <input type="submit" value="Send">
  </form>

  <h2>Exercise 2:
  <form action="exercise xp.html" method="post">
    <label for="post-name">Name</label>
    <input id="post-name" name="name" type="text" required>

    <label for="post-message">Message</label>
    <textarea id="post-message" name="message" rows="5" required></textarea>

    <input type="submit" value="Send">
  </form>

  <script src="exercise xp.js"></script>
</body>
</html>
