<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="pokedex app.css">
</head>
<body>
    <main class="pokedex-app">
        <header class="header">
            <div class="brand"><span class="brand-mark"><i class="fa-solid fa-circle-dot"></i></span><span>POKEDEX</span></div>
            <p>Gotta catalog them all</p>
        </header>

        <section class="device" aria-label="Pokemon details">
            <div class="device-top"><span></span><span></span><span></span></div>
            <div id="pokemon-display" class="pokemon-display empty">
                <div class="empty-ball"><i class="fa-solid fa-circle-question"></i></div>
                <h1>Who's that Pokemon?</h1>
                <p>Press the red button to discover a Pokemon.</p>
            </div>
            <div id="pokemon-status" class="status" aria-live="polite"></div>
            <div class="device-controls">
                <button id="previous-pokemon" class="nav-button" type="button" aria-label="Previous Pokemon" disabled><i class="fa-solid fa-chevron-left"></i></button>
                <button id="random-pokemon" class="random-button" type="button"><i class="fa-solid fa-shuffle"></i> Random Pokemon</button>
                <button id="next-pokemon" class="nav-button" type="button" aria-label="Next Pokemon"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </section>

        <footer><span>POKEAPI</span><span>FIELD GUIDE / 001</span></footer>
    </main>
    <script src="pokedex app.js"></script>
</body>
</html>
