<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Character Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="stars wars web.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <p class="eyebrow">GALACTIC ARCHIVES // 001</p>
            <div class="signal"><span></span> LIVE DATA LINK</div>
        </header>

        <section class="hero" aria-labelledby="page-title">
            <p class="kicker">A long time ago, in a browser far, far away...</p>
            <h1 id="page-title">Star Wars<br><em>Explorer</em></h1>
            <p class="intro">Access a random character record from across the galaxy.</p>
            <button id="character-button" type="button">
                <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
                Find a character
            </button>
        </section>

        <section id="character-card" class="character-card empty" aria-live="polite">
            <i class="fa-solid fa-satellite-dish" aria-hidden="true"></i>
            <p>Awaiting your command</p>
        </section>

        <footer>
            <span>SWAPI.TECH</span>
            <span>TRANSMISSION SECURE</span>
        </footer>
    </main>
    <script src="stars wars web.js"></script>
</body>
</html>
