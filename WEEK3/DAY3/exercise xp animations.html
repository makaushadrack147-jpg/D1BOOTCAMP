<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Exercise XP Animations</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      p {
        background: yellow;
        color: red;
        margin: 6px 0;
      }
      #container {
        width: 400px;
        height: 400px;
        position: relative;
        background: yellow;
        border: 1px solid #333;
      }
      #animate {
        width: 50px;
        height: 50px;
        position: absolute;
        background-color: red;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <button id="clear">Clear Interval</button>

    <p>
      <button onclick="myMove()">Click Me</button>
    </p>
    <div id="container">
      <div id="animate"></div>
    </div>

    <script src="exercise xp animations.js"></script>
  </body>
</html>
